{{- /*
The browser pod holds signed-in admin sessions of SaaS panels and its CDP has no sign-in: only
the app pods may connect to it (compose.yaml publishes no browser port for the same reason).
Egress stays open: the browser opens the SaaS panels and polls the app's API.
*/ -}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "open-revoke.component" (dict "root" . "component" "browser") }}
  labels:
    {{- include "open-revoke.componentLabels" (dict "root" . "component" "browser") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "open-revoke.selectorLabels" (dict "root" . "component" "browser") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "open-revoke.selectorLabels" (dict "root" . "component" "app") | nindent 14 }}
      ports:
        - port: 9223
          protocol: TCP
        - port: 6080
          protocol: TCP
{{- end }}
