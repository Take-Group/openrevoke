{{- /*
The installation's secrets (the .env that install.sh writes for Docker Compose). Generated once:
on upgrade `lookup` reads the values of the existing Secret, so the key and the password never
change. `helm template` and client-side dry runs cannot look up and show new random values.
*/ -}}
{{- if not .Values.secrets.existingSecret }}
{{- $name := include "open-revoke.fullname" . }}
{{- $current := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- $secretKey := .Values.secrets.secretKey }}
{{- if not $secretKey }}
{{- $secretKey = get $current "OPEN_REVOKE_SECRET_KEY" | b64dec }}
{{- end }}
{{- if not $secretKey }}
{{- /* Fernet key: 32 random bytes, URL-safe base64. */}}
{{- $secretKey = randBytes 32 | replace "+" "-" | replace "/" "_" }}
{{- end }}
{{- $password := "" }}
{{- if .Values.postgresql.enabled }}
{{- $password = .Values.secrets.postgresPassword }}
{{- if not $password }}
{{- $password = get $current "POSTGRES_PASSWORD" | b64dec }}
{{- end }}
{{- if not $password }}
{{- $password = randAlphaNum 32 }}
{{- end }}
{{- else }}
{{- $password = required "externalDatabase.password (or secrets.existingSecret) is required when postgresql.enabled is false" .Values.externalDatabase.password }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "open-revoke.labels" . | nindent 4 }}
  annotations:
    # Kept on `helm uninstall`: the PostgreSQL volume and the encrypted connector secrets need it.
    helm.sh/resource-policy: keep
type: Opaque
data:
  OPEN_REVOKE_SECRET_KEY: {{ $secretKey | b64enc | quote }}
  POSTGRES_PASSWORD: {{ $password | b64enc | quote }}
{{- end }}
