# Artifact Hub metadata of the Helm chart oci://ghcr.io/take-group/charts/open-revoke.
# release.yml pushes this file with oras as ghcr.io/take-group/charts/open-revoke:artifacthub.io
# (https://artifacthub.io/docs/topics/repositories/helm-charts/), and skips the push while
# repositoryID is the placeholder below.
#
# repositoryID: a maintainer registers the repository in Artifact Hub (Control Panel, Add
# repository, kind "Helm charts", URL oci://ghcr.io/take-group/charts/open-revoke) and copies the
# ID Artifact Hub shows into this field. Artifact Hub then marks the publisher as verified.
repositoryID: 00000000-0000-0000-0000-000000000000
