# Release of one version, started by pushing the tag vX.Y.Z (scripts/release.sh makes it).
#
#   checks         the CI checks (ci.yml), from scratch: a tag made without release.sh is checked too
#   prepare        version, pre-release or not, image tags, release notes from CHANGELOG.md,
#                  previous stable release
#   build-test     release-test.yml: amd64 images loaded into the runner's Docker (not pushed),
#                  Trivy scan (a fixable CRITICAL stops the release), the release bundle, a fresh
#                  install, an update from the previous release and a rollback, the Helm chart on kind
#   publish        release-publish.yml: multi-arch images (amd64 and arm64, each on a native
#                  runner) with SBOM, pushed by digest (nothing is pushed before the tests pass);
#                  one tag set per image (X.Y.Z, X.Y, latest; a pre-release only X.Y.Z), cosign
#                  keyless signature; the final release files and SHA256SUMS; GitHub artifact
#                  attestations (SLSA Build Level 3 provenance) of both images and every file
#   chart          the tested Helm chart pushed to oci://ghcr.io/take-group/charts and signed with
#                  cosign; the Artifact Hub metadata (deploy/helm/artifacthub-repo.yml) next to it
#   release        cosign signature of SHA256SUMS, immutable GitHub Release with the notes, bundle,
#                  chart's .tgz and the attestation bundle
#
# Plan: docs/product/release/03-wydanie.md in the private workspace; tooling:
# skills/backend/releases.md. Parts marked "GitHub only" cannot be tried on a laptop: they need
# the repository, ghcr.io, the OIDC token of Actions or the arm64 runners.
name: Release

on:
  push:
    tags: ["v*"]

# Each job asks for what it needs: contents write only to create the release, packages write only
# to push images, id-token write only to sign (cosign keyless, OIDC).
permissions:
  contents: read

# Explicit bash: GitHub then adds -o pipefail, so `install.sh | tee` fails when install.sh fails.
defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/take-group/open-revoke
  BROWSER_IMAGE: ghcr.io/take-group/open-revoke-browser
  # Helm chart (deploy/helm/open-revoke, docs/kubernetes.md): oci://ghcr.io/take-group/charts/open-revoke
  CHART_REGISTRY: ghcr.io/take-group/charts
  CHART: ghcr.io/take-group/charts/open-revoke

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] actionlint does not know $/ yet; a release cannot be tested before a tag
    permissions:
      contents: read

  prepare:
    name: Prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      tags: ${{ steps.previous.outputs.tags }}
      latest: ${{ steps.previous.outputs.latest }}
      previous: ${{ steps.previous.outputs.previous }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version from the tag
        id: version
        run: |
          version=${GITHUB_REF_NAME#v}
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::$GITHUB_REF_NAME is not vX.Y.Z or vX.Y.Z-suffix"
            exit 1
          fi
          case $version in *-*) prerelease=true ;; *) prerelease=false ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/notes"
          awk -v head="## [$VERSION]" '
            index($0, head) == 1 { on = 1; next }
            /^## \[/ && on { exit }
            on
          ' CHANGELOG.md > "$RUNNER_TEMP/notes/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes/notes.md"; then
            echo "::error::CHANGELOG.md has no section ## [$VERSION]: cut the release with scripts/release.sh"
            exit 1
          fi
          cat "$RUNNER_TEMP/notes/notes.md"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes/notes.md
          if-no-files-found: error

      # GitHub only: reads the releases of this repository.
      - name: Previous stable release and image tags
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          # `gh release view` without a tag is the repository's latest release: no drafts, no
          # pre-releases. None yet (first release): empty, and the update test is skipped.
          previous=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2> /dev/null || true)
          previous=${previous#v}
          newer=true
          if [ -n "$previous" ]; then
            top=$(sh scripts/newest-version.sh "$previous" "$VERSION")
            if [ "$top" != "$VERSION" ] || [ "$previous" = "$VERSION" ]; then
              # A fix for an older line (0.4.3 after 0.5.0): no update test from a newer release,
              # and `latest` stays where it is.
              newer=false
              previous=""
            fi
          fi
          if [ "$PRERELEASE" = true ]; then
            tags="$VERSION"
            latest=false
          else
            minor=$(echo "$VERSION" | cut -d. -f1-2)
            tags="$VERSION $minor"
            latest=$newer
            [ "$latest" = true ] && tags="$tags latest"
          fi
          {
            echo "previous=$previous"
            echo "tags=$tags"
            echo "latest=$latest"
          } >> "$GITHUB_OUTPUT"
          echo "Previous stable release: ${previous:-none}. Image tags: $tags. Latest: $latest."

  build-test:
    name: Build and test
    needs: [checks, prepare]
    uses: ./.github/workflows/release-test.yml # zizmor: ignore[self-repository] actionlint does not know $/ yet; a release cannot be tested before a tag
    permissions:
      contents: read
      # Pulls the images of the previous release for the update test.
      packages: read
      # Trivy reports of the images go to the Security tab.
      security-events: write
    with:
      version: ${{ needs.prepare.outputs.version }}
      previous: ${{ needs.prepare.outputs.previous }}
      prerelease: ${{ needs.prepare.outputs.prerelease }}

  # Images built, signed and attested, release files with their provenance: a reusable workflow,
  # so the attestations carry its identity (SLSA v1 Build Level 3, see release-publish.yml).
  publish:
    name: Publish
    needs: [prepare, build-test]
    uses: ./.github/workflows/release-publish.yml # zizmor: ignore[self-repository] actionlint does not know $/ yet; a release cannot be tested before a tag
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    with:
      version: ${{ needs.prepare.outputs.version }}
      tags: ${{ needs.prepare.outputs.tags }}

  # Only after the images are tagged: the chart's default image tag is this version.
  chart:
    name: Publish the Helm chart
    needs: [prepare, build-test, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: helm-chart
          path: ${{ runner.temp }}/chart

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0

      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      - uses: oras-project/setup-oras@ac735097e22fe643015b0d19645f7c9a69942128 # v2.0.4

      # cosign and oras read the Docker credentials; helm keeps its own (below).
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # GitHub only: pushes to ghcr.io and signs with the workflow's OIDC identity (keyless).
      - name: Push and sign the chart
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "$RUNNER_TEMP/chart/open-revoke-$VERSION.tgz" "oci://$CHART_REGISTRY" 2>&1 | tee "$RUNNER_TEMP/helm-push.log"
          digest=$(sed -n 's/^Digest: *//p' "$RUNNER_TEMP/helm-push.log" | tail -n 1)
          echo "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$' || { echo "::error::helm push printed no digest"; exit 1; }
          cosign sign --yes "$CHART@$digest"
          {
            echo "### Helm chart"
            echo "- \`$CHART@$digest\` ($VERSION)"
          } >> "$GITHUB_STEP_SUMMARY"

      # Artifact Hub reads the repository metadata from the tag artifacthub.io next to the chart
      # (https://artifacthub.io/docs/topics/repositories/helm-charts/). Skipped until a maintainer
      # puts the repository ID into the file after registering the chart there.
      - name: Artifact Hub metadata
        working-directory: deploy/helm
        run: |
          if grep -q '^repositoryID: 00000000-0000-0000-0000-000000000000' artifacthub-repo.yml; then
            echo "- Artifact Hub metadata not pushed: deploy/helm/artifacthub-repo.yml has the placeholder repositoryID." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          oras push "$CHART:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

  release:
    name: GitHub Release
    needs: [prepare, publish, chart]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      LATEST: ${{ needs.prepare.outputs.latest }}
      APP_DIGEST: ${{ needs.publish.outputs.app-digest }}
      BROWSER_DIGEST: ${{ needs.publish.outputs.browser-digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: ${{ runner.temp }}/bundle

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes

      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      # GitHub only: keyless signature with the workflow's OIDC identity.
      - name: Check and sign SHA256SUMS
        working-directory: ${{ runner.temp }}/bundle
        run: |
          sha256sum --check SHA256SUMS
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS

      - name: Verification steps in the release notes
        run: |
          identity="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          publisher="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/release-publish.yml@$GITHUB_REF"
          signer="$GITHUB_REPOSITORY/.github/workflows/release-publish.yml"
          cat >> "$RUNNER_TEMP/notes/notes.md" << EOF

          ### Install or update

          \`\`\`bash
          curl -fsSLO $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/v$VERSION/install.sh
          sh install.sh --version $VERSION
          \`\`\`

          An existing installation: \`open-revoke update --to $VERSION\`.

          Kubernetes (docs/kubernetes.md): \`helm upgrade --install open-revoke oci://$CHART --version $VERSION\`.

          ### Verify

          \`\`\`bash
          sha256sum --check SHA256SUMS
          cosign verify-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json \\
            --certificate-identity "$identity" \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          cosign verify $IMAGE:$VERSION \\
            --certificate-identity "$publisher" \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          cosign verify $BROWSER_IMAGE:$VERSION \\
            --certificate-identity "$publisher" \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          cosign verify $CHART:$VERSION \\
            --certificate-identity "$identity" \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`

          The release is immutable: its files and tag cannot change after publication.

          \`\`\`bash
          gh release verify v$VERSION --repo $GITHUB_REPOSITORY
          gh release verify-asset v$VERSION open-revoke-$VERSION.tar.gz --repo $GITHUB_REPOSITORY
          \`\`\`

          SLSA Build Level 3 provenance (GitHub artifact attestations, signed by the reusable
          workflow \`release-publish.yml\`). Offline: add \`--bundle open-revoke-$VERSION.provenance.sigstore.json\`
          to the first command.

          \`\`\`bash
          gh attestation verify open-revoke-$VERSION.tar.gz --repo $GITHUB_REPOSITORY \\
            --signer-workflow $signer --source-ref $GITHUB_REF
          gh attestation verify oci://$IMAGE@$APP_DIGEST --repo $GITHUB_REPOSITORY \\
            --signer-workflow $signer --source-ref $GITHUB_REF
          gh attestation verify oci://$BROWSER_IMAGE@$BROWSER_DIGEST --repo $GITHUB_REPOSITORY \\
            --signer-workflow $signer --source-ref $GITHUB_REF
          \`\`\`
          EOF

      # GitHub only. VERSION is attached because install.sh and `open-revoke update` read
      # releases/latest/download/VERSION to find the newest stable release.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ runner.temp }}/bundle
        run: |
          flags=(--verify-tag --title "Open Revoke $VERSION" --notes-file "$RUNNER_TEMP/notes/notes.md" "--latest=$LATEST")
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${flags[@]}" \
            "open-revoke-$VERSION.tar.gz" "open-revoke-chart-$VERSION.tgz" install.sh SHA256SUMS SHA256SUMS.sigstore.json VERSION \
            "open-revoke-$VERSION.provenance.sigstore.json"
