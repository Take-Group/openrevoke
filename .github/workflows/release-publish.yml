# Publication of a release, called by release.yml after release-test.yml passed: multi-arch
# images pushed by digest, tagged and signed with cosign, the final release files with SHA256SUMS,
# and GitHub artifact attestations (SLSA build provenance) of both images and every release file.
#
# Why a separate reusable workflow: the attestations are signed with the identity of this file
# (release-publish.yml), not of the caller. A verifier pins it with
# `gh attestation verify --signer-workflow Take-Group/openrevoke/.github/workflows/release-publish.yml`,
# which is GitHub's way to reach SLSA v1 Build Level 3 (docs: "Using artifact attestations and
# reusable workflows to achieve SLSA v1 Build Level 3"). The images are built here; the release
# files come from release-test.yml of the same run and the same commit.
#
# Its artifact release-files (the files, SHA256SUMS and the attestation bundle) belongs to the
# calling run, so the release job of release.yml downloads it.
name: Release publish

on:
  workflow_call:
    inputs:
      version:
        description: Version without the v, e.g. 0.1.0 or 0.1.0-rc.1
        type: string
        required: true
      tags:
        description: Image tags, space-separated, e.g. "0.1.0 0.1 latest"
        type: string
        required: true
      browser-packages-key:
        description: Browser packages key of the tested amd64 image (release-test.yml)
        type: string
        required: true
      app-layers:
        description: SHA-256 of the tested amd64 app image's layer list (release-test.yml)
        type: string
        required: true
      browser-layers:
        description: SHA-256 of the tested amd64 browser image's layer list (release-test.yml)
        type: string
        required: true
    outputs:
      app-digest:
        description: Digest of the multi-arch app image
        value: ${{ jobs.tag-and-sign.outputs.app-digest }}
      browser-digest:
        description: Digest of the multi-arch browser image
        value: ${{ jobs.tag-and-sign.outputs.browser-digest }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  IMAGE: ghcr.io/take-group/openrevoke
  BROWSER_IMAGE: ghcr.io/take-group/openrevoke-browser
  # Docker Hub mirror of both images (same digests), pushed after ghcr.io.
  HUB_IMAGE: docker.io/takegroup/openrevoke
  HUB_BROWSER_IMAGE: docker.io/takegroup/openrevoke-browser

jobs:
  publish:
    name: Publish ${{ matrix.platform }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            slug: linux-amd64
            runner: ubuntu-24.04
          # GitHub only: native arm64 runner. Building Next.js under QEMU on an amd64 runner also
          # works but is many times slower; if arm64 runners are not available for the repository,
          # use ubuntu-24.04 here and add docker/setup-qemu-action@v4 before buildx.
          - platform: linux/arm64
            slug: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # amd64 takes the key of the tested image, so its package layer is the tested one from the
      # cache. arm64 has no tested image and computes its own on the native runner.
      - name: Browser packages key
        id: packages
        env:
          TESTED_KEY: ${{ inputs.browser-packages-key }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          if [ "$PLATFORM" = linux/amd64 ]; then key=$TESTED_KEY; else key=$(scripts/browser-packages-key.sh); fi
          echo "$key" | grep -Eq '^[0-9a-f]{64}$' || { echo "::error::invalid browser packages key: '$key'"; exit 1; }
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: OCI labels
        id: labels
        run: |
          {
            echo "app<<EOF"
            echo "org.opencontainers.image.title=Open Revoke"
            echo "org.opencontainers.image.description=Self-hosted panel for SaaS accounts, costs and offboarding"
            echo "org.opencontainers.image.version=$VERSION"
            echo "org.opencontainers.image.revision=$GITHUB_SHA"
            echo "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
            echo "org.opencontainers.image.licenses=MIT"
            echo "EOF"
            echo "browser<<EOF"
            echo "org.opencontainers.image.title=Open Revoke browser"
            echo "org.opencontainers.image.description=Chromium with noVNC for Open Revoke browser connectors"
            echo "org.opencontainers.image.version=$VERSION"
            echo "org.opencontainers.image.revision=$GITHUB_SHA"
            echo "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
            echo "org.opencontainers.image.licenses=MIT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Pushed by digest only: no tag points at it until tag-and-sign has both platforms.
      - name: Build and push app (${{ matrix.platform }})
        id: app
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: app
          platforms: ${{ matrix.platform }}
          build-args: OPEN_REVOKE_VERSION=${{ env.VERSION }}
          labels: ${{ steps.labels.outputs.app }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=app-${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=app-${{ matrix.slug }}

      - name: Build and push browser (${{ matrix.platform }})
        id: browser
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: browser
          build-args: BROWSER_PACKAGES_KEY=${{ steps.packages.outputs.key }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.labels.outputs.browser }}
          outputs: type=image,name=${{ env.BROWSER_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=browser-${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=browser-${{ matrix.slug }}

      # The amd64 images must be the ones release-test.yml tested: same layers, only labels and
      # attestations differ. A cache miss would rebuild layers that nobody tested; it stops here.
      - name: Published amd64 layers are the tested ones
        if: matrix.platform == 'linux/amd64'
        env:
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          BROWSER_DIGEST: ${{ steps.browser.outputs.digest }}
          APP_LAYERS: ${{ inputs.app-layers }}
          BROWSER_LAYERS: ${{ inputs.browser-layers }}
        run: |
          layers() {
            docker buildx imagetools inspect "$1" --format '{{json .Image.RootFS.DiffIDs}}' \
              | jq -c . | sha256sum | cut -d' ' -f1
          }
          check() {
            got=$(layers "$1")
            [ "$got" = "$2" ] || { echo "::error::$1 has other layers than the tested image ($got, tested $2)"; exit 1; }
            echo "$1: layers match the tested image"
          }
          check "$IMAGE@$APP_DIGEST" "$APP_LAYERS"
          check "$BROWSER_IMAGE@$BROWSER_DIGEST" "$BROWSER_LAYERS"

      - name: Keep the digests
        env:
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          BROWSER_DIGEST: ${{ steps.browser.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests/app" "$RUNNER_TEMP/digests/browser"
          touch "$RUNNER_TEMP/digests/app/${APP_DIGEST#sha256:}"
          touch "$RUNNER_TEMP/digests/browser/${BROWSER_DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.slug }}
          path: ${{ runner.temp }}/digests/
          if-no-files-found: error
          retention-days: 1

  tag-and-sign:
    name: Tag, sign and attest images
    needs: [publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      app-digest: ${{ steps.tags.outputs.app-digest }}
      browser-digest: ${{ steps.tags.outputs.browser-digest }}
    env:
      VERSION: ${{ inputs.version }}
      TAGS: ${{ inputs.tags }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      # GitHub only: pushes tags to ghcr.io and signs with the workflow's OIDC identity
      # (keyless, the signature goes to the public Sigstore transparency log). The certificate
      # identity is this file, release-publish.yml.
      - name: Multi-arch tags and signatures
        id: tags
        run: |
          publish() {
            name=$1
            dir=$2
            output=$3
            args=()
            for tag in $TAGS; do args+=(--tag "$name:$tag"); done
            sources=()
            for digest in "$dir"/*; do sources+=("$name@sha256:$(basename "$digest")"); done
            [ "${#sources[@]}" = 2 ] || { echo "::error::expected 2 platform digests of $name, got ${#sources[@]}"; exit 1; }
            docker buildx imagetools create "${args[@]}" \
              --annotation "index:org.opencontainers.image.version=$VERSION" \
              --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA" \
              --annotation "index:org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --annotation "index:org.opencontainers.image.licenses=MIT" \
              "${sources[@]}"
            digest=$(docker buildx imagetools inspect "$name:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
            docker buildx imagetools inspect "$name@$digest"
            cosign sign --yes "$name@$digest"
            echo "- \`$name@$digest\` ($TAGS)" >> "$GITHUB_STEP_SUMMARY"
            echo "$output=$digest" >> "$GITHUB_OUTPUT"
          }
          echo "### Images" >> "$GITHUB_STEP_SUMMARY"
          publish "$IMAGE" "$RUNNER_TEMP/digests/app" app-digest
          publish "$BROWSER_IMAGE" "$RUNNER_TEMP/digests/browser" browser-digest

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Docker Hub gets a copy of the signed ghcr.io index: same digest, same tags, its own
      # cosign signature (signatures live next to the image in each registry).
      - name: Mirror to Docker Hub
        env:
          APP_DIGEST: ${{ steps.tags.outputs.app-digest }}
          BROWSER_DIGEST: ${{ steps.tags.outputs.browser-digest }}
        run: |
          mirror() {
            source=$1
            target=$2
            args=()
            for tag in $TAGS; do args+=(--tag "$target:$tag"); done
            docker buildx imagetools create "${args[@]}" "$source"
            cosign sign --yes "$target@${source#*@}"
            echo "- \`$target@${source#*@}\` ($TAGS)" >> "$GITHUB_STEP_SUMMARY"
          }
          mirror "$IMAGE@$APP_DIGEST" "$HUB_IMAGE"
          mirror "$BROWSER_IMAGE@$BROWSER_DIGEST" "$HUB_BROWSER_IMAGE"

      # SLSA build provenance of the multi-arch index, stored by GitHub and pushed next to the
      # image in ghcr.io. `with` cannot read job `env`, hence the literal image names.
      - name: Attest the app image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/take-group/openrevoke
          subject-digest: ${{ steps.tags.outputs.app-digest }}
          push-to-registry: true

      - name: Attest the browser image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/take-group/openrevoke-browser
          subject-digest: ${{ steps.tags.outputs.browser-digest }}
          push-to-registry: true

  # The release files in their final form (bundle, install.sh, VERSION, the chart's .tgz), built
  # by release-test.yml, and SHA256SUMS over them. One attestation covers every line of SHA256SUMS;
  # its Sigstore bundle is a release file too, for offline verification.
  release-files:
    name: Release files and their provenance
    needs: [tag-and-sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: ${{ runner.temp }}/bundle

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: helm-chart
          path: ${{ runner.temp }}/chart

      # The chart as a release file, named apart from the bundle (open-revoke-X.Y.Z.tar.gz), and
      # listed in SHA256SUMS before the signature. install.sh and `open-revoke update` look up only
      # the bundle's line.
      - name: Add the Helm chart to the release files
        working-directory: ${{ runner.temp }}/bundle
        run: |
          cp "$RUNNER_TEMP/chart/open-revoke-$VERSION.tgz" "open-revoke-chart-$VERSION.tgz"
          sha256sum "open-revoke-chart-$VERSION.tgz" >> SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Attest the release files
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/bundle/SHA256SUMS

      - name: Keep the attestation bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" "$RUNNER_TEMP/bundle/open-revoke-$VERSION.provenance.sigstore.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: ${{ runner.temp }}/bundle/
          if-no-files-found: error
