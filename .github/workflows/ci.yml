# Checks of every push to main and every pull request. The release workflow (release.yml) calls
# this file too (workflow_call), so a tag is checked the same way.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (ruff, migrations, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    # alembic check compares the models with a database migrated to the newest revision, so the
    # job needs a real PostgreSQL. Redis is there because the settings and the db command expect it.
    services:
      postgres:
        image: postgres:18.7
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: open_revoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d open_revoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8.10.3-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/open_revoke
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Generate a throwaway secret key
        run: |
          key=$(openssl rand -base64 32 | tr '+/' '-_')
          echo "::add-mask::$key"
          echo "OPEN_REVOKE_SECRET_KEY=$key" >> "$GITHUB_ENV"

      - name: Apply migrations to an empty database
        run: uv run python -m app.db migrate

      - name: Models match the migrations
        # Fails when a model changed without a migration (alembic revision --autogenerate).
        run: uv run alembic check

      # Unit tests and the integration tests against the migrated database above.
      - name: Tests
        run: uv run pytest

  frontend:
    name: Panel (lint, typecheck, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Same version as the oven/bun image in the Dockerfile.
          bun-version: 1.4.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  helm:
    name: Helm chart (lint, kubeconform)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deploy/helm/open-revoke
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      # Helm reads no file outside the chart, so the chart keeps a copy of the Temporal scripts and
      # dynamic config that compose.yaml mounts. The copy must not drift from the original.
      - name: Temporal files match backend/temporal
        run: |
          diff -r ../../../backend/temporal/scripts files/temporal/scripts
          diff -r ../../../backend/temporal/dynamicconfig files/temporal/dynamicconfig

      - name: Lint
        run: helm lint --strict .

      # The chart rendered with the defaults, with an ingress and with an external database, checked
      # against the Kubernetes API schemas (kubeconform, strict: no unknown fields).
      - name: Rendered manifests are valid Kubernetes objects
        run: |
          kubeconform() {
            docker run --rm -i ghcr.io/yannh/kubeconform:v0.8.0 -strict -summary -kubernetes-version 1.31.0 -
          }
          helm template ci . | kubeconform
          helm template ci . --set ingress.enabled=true --set ingress.host=revoke.example.com \
            --set ingress.className=nginx --set ingress.tls.enabled=true --set ingress.tls.secretName=revoke-tls \
            | kubeconform
          helm template ci . --set postgresql.enabled=false --set externalDatabase.host=db.example.com \
            --set externalDatabase.password=ci-password --set externalDatabase.tls=true \
            | kubeconform

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The image the release skill names (skills/backend/releases.md), so CI and a local run agree.
      # Severity warning and up: the info notes (SC2015 `a && b || c`, SC2012 `ls`) are deliberate
      # in the host command today.
      - name: Installer and host command (POSIX sh)
        # From deploy/ so `# shellcheck source=lib/...` in open-revoke resolves.
        working-directory: deploy
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:stable \
            -s sh -x -S warning install.sh open-revoke

      - name: Host command libraries (POSIX sh)
        # -x above does not report problems inside the sourced files, so they are checked alone.
        # SC2034 (variable unused) is off here: the libraries set variables (ASSUME_YES,
        # BACKUP_LAST) that the sourcing script reads.
        working-directory: deploy
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:stable \
            -s sh -S warning -e SC2034 lib/*.sh

      - name: Release scripts
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:stable \
            -s sh scripts/*.sh
