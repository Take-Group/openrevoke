# OpenSSF Scorecard: scores the repository's security practices (pinned actions, token permissions,
# signed releases, branch protection, ...) and publishes the result to scorecard.dev, which the
# badge in README.md reads. Findings also go to the Security tab as code scanning alerts.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # Upload the SARIF to code scanning.
      security-events: write
      # Sign the published result (OIDC), required by publish_results.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: results.sarif
