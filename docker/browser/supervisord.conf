; The `browser` container: Chromium on a virtual screen, shown through noVNC.
;
;   xvnc       TigerVNC: X server :99 and VNC in one, 127.0.0.1:5900 only, no password, starts at 2560x1440 (Chromium at scale 2).
;              The live view on the /browser page resizes the screen to its own size (live.html resize=1).
;   wm         matchbox: the Chromium window is always maximized, full screen
;   chromium   headful, profile in /profile, CDP on 127.0.0.1:9222
;   cdp-proxy  socat 0.0.0.0:9223 -> 127.0.0.1:9222 (Chrome binds CDP to localhost only)
;   novnc      websockify + noVNC on 0.0.0.0:6080 in the compose network; the panel gets it through the API (live_proxy.py)
;
; Skill: skills/backend/browser.md.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:xvnc]
; Faster than Xvfb + x11vnc: the X server knows what changed, nothing polls the screen.
; -localhost: VNC only from inside the container (websockify). Starts at 2560x1440 with Chromium at
; scale 2 (start-chromium.sh): pages laid out as on 1280x720. Viewers may change the size
; (SetDesktopSize, on by default): the panel's /browser page sets it to its own size times 2
; (live.html resize=1), so pages fill the view and stay sharp on a Retina screen. The last
; viewer to resize wins; automation over CDP sees the size the view left.
command=/usr/bin/Xvnc :99 -geometry 2560x1440 -depth 24 -rfbport 5900 -localhost -SecurityTypes None -AlwaysShared -nolisten tcp -ac
priority=10
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:chromium]
; Restarts when Chromium crashes or the user closes its last window.
command=/usr/local/bin/start-chromium.sh
priority=20
autorestart=true
startsecs=3
startretries=1000
stopsignal=TERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:policy-sync]
; Polls the panel API for the admin's chosen password manager and, on a change, rewrites the
; Chromium force-install policy and restarts Chromium (skills/backend/browser.md).
command=/usr/local/bin/policy-sync.sh
priority=50
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:cdp-proxy]
command=/usr/bin/socat TCP-LISTEN:9223,bind=0.0.0.0,fork,reuseaddr TCP:127.0.0.1:9222
priority=30
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:wm]
command=/usr/local/bin/start-wm.sh
priority=15
autorestart=true
startretries=1000
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:novnc]
; ExpectOrigin: only the listed origins may open the VNC WebSocket: the API's live view proxy
; (entrypoint.sh adds it) and, in development, the page of a published noVNC port. Without it
; any website open in the admin's own browser could connect to a published port and drive
; this Chromium with its logged-in admin sessions (WebSockets ignore the same-origin policy).
command=/usr/bin/websockify --web /usr/share/novnc --auth-plugin websockify.auth_plugins.ExpectOrigin --auth-source "%(ENV_NOVNC_ALLOWED_ORIGINS)s" 0.0.0.0:6080 127.0.0.1:5900
priority=40
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
