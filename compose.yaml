# Self-hosting stack of Open Revoke: one `app` container (API, worker, panel), the shared
# browser, and official PostgreSQL, Redis and Temporal images. Install guide:
# docs/self-hosting.md; releases and updates: skills/backend/releases.md.
#
# One port reaches the outside: the panel (app:3000). The panel proxies /api to
# the API and the live view of the shared browser goes through the API behind
# the panel session, so the browser container publishes nothing.
#
# Installed with install.sh, this file comes from a release bundle with the version
# filled in, and the host command `open-revoke` runs it. By hand:
#
#   docker compose up -d                            images of OPEN_REVOKE_VERSION from the registry
#   docker compose --profile https up -d            + Caddy with Let's Encrypt for PUBLIC_URL
#   docker compose -f compose.yaml -f compose.build.yaml up -d --build    build from this source
#
# Development does not use this file: compose.dev.yaml (hot reload). Do not run both
# under the same project name; COMPOSE_PROJECT_NAME in .env changes it.
name: open-revoke

x-timezone: &timezone
  # The server's time zone (logs, container clocks); install.sh copies it from the host.
  # Dates in the panel use the organization's zone.
  TZ: ${TZ:-UTC}

services:
  postgres:
    image: postgres:18.7
    command: ["postgres", "-c", "timezone=${TZ:-UTC}", "-c", "log_timezone=${TZ:-UTC}"]
    environment:
      <<: *timezone
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env, see .env.example}
      POSTGRES_DB: open_revoke
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d open_revoke"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:8.10.3-alpine
    environment:
      <<: *timezone
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  temporal-schema-setup:
    image: temporalio/admin-tools:1.32.2
    environment:
      <<: *timezone
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      POSTGRES_SEEDS: postgres
      SQL_PASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["/bin/sh"]
    command: ["/scripts/setup-postgres.sh"]
    volumes:
      - ./backend/temporal/scripts:/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy

  temporal:
    image: temporalio/server:1.32.2
    environment:
      <<: *timezone
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      POSTGRES_SEEDS: postgres
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    volumes:
      - ./backend/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    depends_on:
      temporal-schema-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "7233"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s

  temporal-create-namespace:
    image: temporalio/admin-tools:1.32.2
    environment:
      <<: *timezone
      TEMPORAL_ADDRESS: temporal:7233
      DEFAULT_NAMESPACE: default
      DEFAULT_NAMESPACE_RETENTION: 24h
    entrypoint: ["/bin/sh"]
    command: ["/scripts/create-namespace.sh"]
    volumes:
      - ./backend/temporal/scripts:/scripts:ro
    depends_on:
      temporal:
        condition: service_healthy

  # One container: database tables (at start), API, Temporal worker and panel.
  app:
    image: ${OPEN_REVOKE_IMAGE:-ghcr.io/take-group/open-revoke}:${OPEN_REVOKE_VERSION:-dev}
    environment:
      <<: *timezone
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/open_revoke
      REDIS_URL: redis://redis:6379/0
      TEMPORAL_HOST: temporal:7233
      TEMPORAL_TASK_QUEUE: open-revoke
      OPEN_REVOKE_SECRET_KEY: ${OPEN_REVOKE_SECRET_KEY:?set it in .env, see .env.example}
      # Hourly check of GitHub for a newer stable release; false for servers without internet.
      OPEN_REVOKE_UPDATE_CHECK: ${OPEN_REVOKE_UPDATE_CHECK:-true}
      OPEN_REVOKE_UPDATE_URL: ${OPEN_REVOKE_UPDATE_URL:-https://api.github.com/repos/Take-Group/openrevoke/releases/latest}
      # One anonymous event when the first admin finishes the setup (TELEMETRY.md); false turns it off.
      OPEN_REVOKE_TELEMETRY: ${OPEN_REVOKE_TELEMETRY:-true}
      OPEN_REVOKE_TELEMETRY_URL: ${OPEN_REVOKE_TELEMETRY_URL:-https://openrevoke.com/api/v1/telemetry}
      # Development only: the "fake" connector with test data (see .env.example).
      OPEN_REVOKE_ENABLE_FAKE_CONNECTOR: ${OPEN_REVOKE_ENABLE_FAKE_CONNECTOR:-false}
      # Development only: one-click form fill on the sign-in pages (see .env.example).
      OPEN_REVOKE_DEV_PREFILL: ${OPEN_REVOKE_DEV_PREFILL:-false}
      # Write actions: seconds between verification reads (development may use 1).
      ACTION_VERIFY_DELAY_SECONDS: ${ACTION_VERIFY_DELAY_SECONDS:-30}
      # Shared browser: CDP through socat in the browser container (skills/backend/browser.md).
      BROWSER_CDP_HOST: browser
      BROWSER_CDP_PORT: "9223"
      # The address people open the panel at. Invite, reset and setup links, Google sign-in, the
      # secure cookie flag and the host names the API answers to all follow it.
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:18410}
      # Connect with Google: base of the OAuth redirect URI, defaults to PUBLIC_URL (.env.example).
      GOOGLE_OAUTH_REDIRECT_BASE: ${GOOGLE_OAUTH_REDIRECT_BASE:-}
    # The panel only. 127.0.0.1 by default: a reverse proxy on the same server (or the
    # "https" profile, which reaches app:3000 inside the compose network) puts it online.
    ports:
      - "${OPEN_REVOKE_BIND:-127.0.0.1}:${OPEN_REVOKE_PORT:-18410}:3000"
    # Alias for the browser: Chromium forces HTTPS for the name `app` (the .app TLD is on the
    # HSTS preload list), so the fake panel of browser_fake is under open-revoke-app.
    networks:
      default:
        aliases:
          - open-revoke-app
    depends_on:
      browser:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal-create-namespace:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Chromium on Xvnc (TigerVNC). The profile (cookies, signed-in admin sessions of SaaS panels)
  # is in the browser-profile volume: whoever has it has those sessions. No published ports:
  # CDP (9223) and noVNC (6080) only inside the compose network; the panel's live view goes
  # through the API, admins only (backend/app/browser/live_proxy.py).
  browser:
    image: ${OPEN_REVOKE_BROWSER_IMAGE:-ghcr.io/take-group/open-revoke-browser}:${OPEN_REVOKE_VERSION:-dev}
    environment:
      <<: *timezone
      # Panel API the browser polls for which password manager to force-install (the admin's
      # choice from /welcome and /settings). The `app` service serves the API on 8000.
      BROWSER_POLICY_API_URL: http://app:8000
    shm_size: 1gb
    volumes:
      - browser-profile:/profile
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9222/json/version"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # HTTPS for PUBLIC_URL (profile "https"): Let's Encrypt when PUBLIC_URL is https:// with a
  # public domain. Skip it when another reverse proxy, Cloudflare Tunnel or Tailscale serves
  # the panel (docs/self-hosting.md).
  caddy:
    image: caddy:2.11
    profiles: ["https"]
    restart: unless-stopped
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
    ports:
      - "${OPEN_REVOKE_HTTP_PORT:-80}:80"
      - "${OPEN_REVOKE_HTTPS_PORT:-443}:443"
      - "${OPEN_REVOKE_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
  browser-profile:
  caddy-data:
  caddy-config:
